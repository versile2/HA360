configuration:
  demo_mode:
    name: "Demo mode"
    description: "Show a fictional family instead of real data, for checking an install."
  allow_demo_param:
    name: "Allow demo link"
    description: "Allow adding ?demo=1 to the address to open a demo session while the app runs on real data."
  log_level:
    name: "Log level"
    description: "Minimum level written to the app log."
  ui_stale_after_minutes:
    name: "Stale after (minutes)"
    description: "Minutes without a new position before a person is shown as stale. This is a floor: the app may wait longer when a source reports slowly."
  ui_offline_after_hours:
    name: "Offline after (hours)"
    description: "Hours without any position before a person is shown as offline. Must be longer than the stale threshold."
  ui_vehicle_stale_after_minutes:
    name: "Vehicle stale after (minutes)"
    description: "Minutes without an update before a vehicle's position is shown as stale."
  ui_low_battery_percent:
    name: "Low battery (percent)"
    description: "Phone battery level at or below which the battery is flagged as low."
  ui_poor_accuracy_meters:
    name: "Poor accuracy (meters)"
    description: "Accuracy radius above which a position is labelled as approximate."
  ui_default_view_radius_km:
    name: "Default view radius (km)"
    description: "Radius of the area the map fits when it first opens."
  ui_max_zone_radius_km:
    name: "Largest drawn zone (km)"
    description: "Zones with a larger radius are never drawn or listed."
  ui_far_away_km:
    name: "Far away from me (km)"
    description: "Distance from you beyond which a person's city and state are shown."
  ui_history_tokens:
    name: "Back gesture steps"
    description: "On by default: the Android Back gesture steps back through the sheet and detail levels. Turn it off and restart the app if Back misbehaves inside the Home Assistant app; Back then leaves the app at once, while Esc and the close button still work."
  features_temp_bubble:
    name: "Temporary bubble"
    description: "Reserved for a later version. Has no effect in 0.1."
  features_add_rows:
    name: "Add rows"
    description: "Reserved for a later version. Has no effect in 0.1."
  fusion_stale_grace_minutes:
    name: "Stale grace (minutes)"
    description: "Extra minutes allowed on top of a source's normal update interval before its position counts as old."
  trips_start_speed_mph:
    name: "Trip start speed (mph)"
    description: "Speed above which movement counts as the start of a drive."
  trips_stop_merge_seconds:
    name: "Stop merge (seconds)"
    description: "Stops shorter than this (red lights, drive-throughs) stay part of the same drive."
  trips_min_distance_miles:
    name: "Minimum drive distance (miles)"
    description: "Drives shorter than this are not recorded."
  trips_min_duration_seconds:
    name: "Minimum drive duration (seconds)"
    description: "Drives shorter than this are not recorded."
  driving_week_start:
    name: "Driving week starts on"
    description: "First day of the week in the weekly Driving report."
  driving_speeding_mph:
    name: "Speeding threshold (mph)"
    description: "Speed above which a stretch of driving counts as speeding (sampled)."
  driving_speeding_min_seconds:
    name: "Speeding minimum (seconds)"
    description: "How long the speed must stay above the threshold to count as speeding."
  driving_phone_min_seconds:
    name: "Phone use minimum (seconds)"
    description: "How long the screen must be in use while driving to count as phone use."
  retention_fix_days:
    name: "Keep position history (days)"
    description: "Stored positions older than this are deleted (100 to 400 days). Each 100 days uses roughly 6–20 MB per tracked person (estimate). The report's 6-month and 1-year periods need at least 185 / 366 days."
  backfill_days:
    name: "Backfill on start (days)"
    description: "How many days of Home Assistant history to read when the app starts. 0 turns it off."
  privacy_log_positions:
    name: "Log positions"
    description: "When on, debug logs include positions. Off by default."
  me_fallback_member:
    name: "Fallback person for 'me'"
    description: "Optional. The member id shown as you when your Home Assistant user is not linked to a person."
  ignore_entities:
    name: "Ignored entities"
    description: "Entity ids that are never used as position sources (for example a tablet or a network tracker)."
  members:
    name: "Household members"
    description: "The people on the map. Leave empty to discover everyone automatically with plain names."
    fields:
      id:
        name: "Id"
        description: "Short unique id: lower-case letters, digits and underscores, starting with a letter."
      display_name:
        name: "Display name"
        description: "Name shown on the map and in lists."
      lore_title:
        name: "Title"
        description: "Optional secondary label shown under the name."
      kind:
        name: "Kind"
        description: "live (default) follows trackers; static is a fixed pin for someone who does not share location."
      person:
        name: "Person entity"
        description: "Optional person entity id. Blank means discover it."
      life360_tracker:
        name: "Life360 tracker"
        description: "Optional device tracker id from Home Assistant's Life360 integration. Blank means discover it."
      companion_tracker:
        name: "Companion app tracker"
        description: "Optional device tracker id of the phone's companion app. Required when the person has more than one."
      avatar:
        name: "Avatar source"
        description: "Where the picture comes from: auto, person, life360 or none."
      color:
        name: "Color"
        description: "Optional color as #RRGGBB."
      sort_order:
        name: "Sort order"
        description: "Optional position in lists, lowest first."
      in_driving_report:
        name: "In driving report"
        description: "Optional. Set to false to leave this person out of the Driving report."
      static_label:
        name: "Static pin label"
        description: "Text on the pin of a static member."
      static_address:
        name: "Static address"
        description: "Stored for your own use. Shown in the app only if Show static address is on."
      static_latitude:
        name: "Static latitude"
        description: "Decimal degrees. Static members need both coordinates."
      static_longitude:
        name: "Static longitude"
        description: "Decimal degrees. Static members need both coordinates."
      static_show_address:
        name: "Show static address"
        description: "Show the static address in the app. Off by default."
  vehicles:
    name: "Vehicles"
    description: "Vehicles shown in the Vehicles section. Leave empty for none."
    fields:
      id:
        name: "Id"
        description: "Short unique id: lower-case letters, digits and underscores, starting with a letter."
      name:
        name: "Name"
        description: "Name shown in lists."
      lore_title:
        name: "Title"
        description: "Optional secondary label shown under the name."
      glyph:
        name: "Icon"
        description: "pickup or car."
      integration:
        name: "Integration"
        description: "fordpass reads the vehicle from Home Assistant's FordPass entities (entity prefix required); none shows a placeholder."
      entity_prefix:
        name: "Entity prefix"
        description: "Lower-case prefix of the vehicle's Home Assistant entities. Required when the integration is fordpass."
      placeholder_note:
        name: "Placeholder note"
        description: "Optional text shown for a vehicle without an integration."
      sort_order:
        name: "Sort order"
        description: "Optional position in lists, lowest first."
  places:
    name: "Places"
    description: "Optional names and kinds for Home Assistant zones. Leave empty to use the zones as they are."
    fields:
      zone:
        name: "Zone"
        description: "A zone entity id, or the exact name of a Home Assistant zone."
      display_name:
        name: "Display name"
        description: "Optional name to show instead of the zone name."
      subtitle:
        name: "Subtitle"
        description: "Optional second line."
      kind:
        name: "Kind"
        description: "Icon family: home, work, family, fun, park, vet, cemetery or other."
      hidden:
        name: "Hidden"
        description: "Optional. Set to true to never draw or list this zone."
network: {}
