name: prune-branches
# Deletes remote branches that are fully merged into main (never main or ci-artifacts). Runs after every push to main.
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: prune-branches, cancel-in-progress: false }
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Delete branches merged into main
        run: |
          set -euo pipefail
          git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"
          for ref in $(git for-each-ref --format="%(refname:strip=3)" refs/remotes/origin); do
            case "$ref" in main|ci-artifacts|HEAD) continue ;; esac
            if git merge-base --is-ancestor "origin/$ref" origin/main; then git push origin --delete "$ref"; fi
          done
