name: release
# 03 section 7.6, S16a. A pushed tag vX.Y.Z builds the image and pushes ghcr.io/versile2/ha360:X.Y.Z, and nothing else: image first, store version
# second (6.6). It does not check that ci.yml was green, that the tag is on main or that the version is new; the person who tags has read the CI
# summary of that commit, and docker-smoke has already run this Dockerfile on every push. Never reuse a version (6.6).
on:
  push: { tags: ["v[0-9]+.[0-9]+.[0-9]+"] }
permissions: {}
concurrency: { group: release, cancel-in-progress: false }
defaults: { run: { shell: bash } }               # explicit shell = bash -eo pipefail
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Tag, realm/config.yaml and CHANGELOG must agree
        run: |
          tag="${GITHUB_REF_NAME}"
          v="${tag#v}"
          if [[ ! $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$tag' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          cfg=$(sed -n -E 's/^version:[[:space:]]*"?([0-9]+\.[0-9]+\.[0-9]+)"?[[:space:]]*(#.*)?$/\1/p' realm/config.yaml)
          cfg=${cfg%%$'\n'*}
          if [[ -z $cfg ]]; then
            echo "::error::could not read a plain MAJOR.MINOR.PATCH 'version:' from realm/config.yaml"
            exit 1
          fi
          if [[ $cfg != "$v" ]]; then
            echo "::error::tag '$tag' says $v but realm/config.yaml says version $cfg"
            exit 1
          fi
          if ! grep -qE "^## ${v//./\\.}([[:space:]]|\$)" realm/CHANGELOG.md; then
            echo "::error::realm/CHANGELOG.md has no section '## $v'"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/versile2/ha360
          tags: type=raw,value=${{ steps.v.outputs.version }}
          flavor: latest=false                  # no "latest" tag: the Supervisor never uses it
      - name: Exactly one tag, the version (no latest)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          WANT: ghcr.io/versile2/ha360:${{ steps.v.outputs.version }}
        run: |
          if [[ $TAGS != "$WANT" ]]; then
            echo "::error::the image tags are '$TAGS', expected only '$WANT'"
            exit 1
          fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64                # config.yaml: arch amd64
          push: true
          provenance: false                     # a plain single manifest: no attestation index for the Supervisor's puller to trip on
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          # No `labels:` from the metadata action on purpose: its defaults would replace the title, description and licence expression that the
          # Dockerfile sets (org.opencontainers.image.licenses lists every bundled licence, licence audit 1); the Dockerfile LABELs already carry the
          # version and revision through the build arguments below.
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
      - name: Anonymous pull check
        env:
          IMAGE: ghcr.io/versile2/ha360:${{ steps.v.outputs.version }}
        run: |
          docker logout ghcr.io
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Anonymous pull works." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=GHCR package is private::Make ghcr.io/versile2/ha360 public once in the GitHub UI (03 section 6.7); until then the Supervisor cannot pull it without registry credentials."
          fi
