name: release
# 03 section 7.6, S16a. Runs automatically on every push to main (that is, when a PR is merged) and can also be run by hand: Actions -> release -> Run workflow,
# on main. It reads `version` (V) from realm/config.yaml, builds the image and pushes ghcr.io/versile2/ha-cartographer:V, and only after that push succeeded
# creates the tag vV on that commit and a GitHub release vV whose notes are the realm/CHANGELOG.md section for V followed by notes generated from the merged PRs
# (.github/release.yml categories). So a PR that bumps the version and adds the CHANGELOG section releases itself when it is merged; the HA store offers V as
# soon as main has it, and the image follows within minutes. If the tag vV already exists, a push run SKIPS cleanly (notice and job summary: bump the version
# to release; this is every merge that does not bump it), while a by-hand run fails with that message (6.6: never re-release). Refuses any ref other than main
# and, when it would release, a V with no `## V` CHANGELOG section. The tag only exists once the image does, so a run that failed before the end can simply be
# run again by hand. The tag is created with GITHUB_TOKEN, which starts no further workflow; this one workflow does everything. Not checked: that ci.yml was
# green; docker-smoke runs this Dockerfile on every push.
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: {}
concurrency: { group: release, cancel-in-progress: false }
defaults: { run: { shell: bash } }               # explicit shell = bash -eo pipefail
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: { contents: write, packages: write }
    steps:
      - name: Only from main
        run: |
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::the release workflow runs on main only (this run is on $GITHUB_REF); choose main in 'Use workflow from'"
            exit 1
          fi
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Commit must be on origin/main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::commit $GITHUB_SHA is not reachable from origin/main"
            exit 1
          fi
      - id: v
        name: Read the version; it must be unreleased and have its CHANGELOG section
        run: |
          v=$(sed -n -E 's/^version:[[:space:]]*"?([0-9]+\.[0-9]+\.[0-9]+)"?[[:space:]]*(#.*)?$/\1/p' realm/config.yaml)
          v=${v%%$'\n'*}
          if [[ -z $v ]]; then
            echo "::error::could not read a plain MAJOR.MINOR.PATCH 'version:' from realm/config.yaml"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [[ -n $(git ls-remote --tags origin "refs/tags/v$v") ]]; then
            if [[ $GITHUB_EVENT_NAME == push ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=Nothing to release::v$v already released; bump realm/config.yaml version to release"
              echo "v$v already released; bump realm/config.yaml version to release" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::the tag v$v already exists on origin; a released version is never released again. Bump version in realm/config.yaml (and add its CHANGELOG section) in a PR, merge it (that releases it), or run this again after bumping."
            exit 1
          fi
          if ! grep -qE "^## ${v//./\\.}([[:space:]]|\$)" realm/CHANGELOG.md; then
            echo "::error::realm/CHANGELOG.md has no section '## $v'"
            exit 1
          fi
      - if: steps.v.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.v.outputs.skip != 'true'
        uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        if: steps.v.outputs.skip != 'true'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/versile2/ha-cartographer
          tags: type=raw,value=${{ steps.v.outputs.version }}
          flavor: latest=false                  # no "latest" tag: the Supervisor never uses it
      - name: Exactly one tag, the version (no latest)
        if: steps.v.outputs.skip != 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          WANT: ghcr.io/versile2/ha-cartographer:${{ steps.v.outputs.version }}
        run: |
          if [[ $TAGS != "$WANT" ]]; then
            echo "::error::the image tags are '$TAGS', expected only '$WANT'"
            exit 1
          fi
      - if: steps.v.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64                # config.yaml: arch amd64
          push: true
          provenance: false                     # a plain single manifest: no attestation index for the Supervisor's puller to trip on
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          # No `labels:` from the metadata action on purpose: its defaults would replace the title, description and licence expression that the
          # Dockerfile sets (org.opencontainers.image.licenses lists every bundled licence, licence audit 1); the Dockerfile LABELs already carry the
          # version and revision through the build arguments below.
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
      - name: Anonymous pull check
        if: steps.v.outputs.skip != 'true'
        env:
          IMAGE: ghcr.io/versile2/ha-cartographer:${{ steps.v.outputs.version }}
        run: |
          docker logout ghcr.io
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Anonymous pull works." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=GHCR package is private::Make ghcr.io/versile2/ha-cartographer public once in the GitHub UI (03 section 6.7); until then the Supervisor cannot pull it without registry credentials."
          fi
      - name: Tag and publish the release (after the image is pushed)
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          # The CHANGELOG section for V (up to the next "## " heading) goes first; --generate-notes appends the notes generated from the merged PRs since the
          # previous release tag, grouped by .github/release.yml. gh creates the tag vV on $GITHUB_SHA.
          awk -v v="$V" 'BEGIN{h="## " v} $0==h || index($0,h " ")==1 {on=1; next} /^## /{on=0} on' realm/CHANGELOG.md > "$RUNNER_TEMP/changelog-section.md"
          gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --notes-file "$RUNNER_TEMP/changelog-section.md" --generate-notes
          echo "Released v$V: image ghcr.io/versile2/ha-cartographer:$V, tag and release created." >> "$GITHUB_STEP_SUMMARY"
