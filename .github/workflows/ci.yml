name: ci
on:
  push: { branches-ignore: [ci-artifacts], tags-ignore: ["**"] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
defaults: { run: { shell: bash } }               # explicit shell = bash -eo pipefail, so "cmd | tee log" still fails the step
env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
jobs:
  guards:                                         # 7.3: seconds; fails fast on policy violations, and the expensive jobs wait for it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Guards (the full output is kept in guards.log, also when a guard fails; make-summary.mjs prints it in SUMMARY.md)
        run: |
          set -o pipefail
          mkdir -p ci-out
          node tools/ci/guards.mjs 2>&1 | tee ci-out/guards.log
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: guards, path: ci-out, retention-days: 3 }

  dotnet:
    needs: guards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: global.json }
      - uses: actions/cache@v6
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: mkdir -p ci-out/trx
      - run: dotnet restore Realm.slnx 2>&1 | tee ci-out/restore.log
      - name: Build (warnings are errors; errors.log is what the author reads)
        run: >
          dotnet build Realm.slnx -c Release --no-restore
          -flp:"logfile=ci-out/build.log;verbosity=minimal" -flp1:"logfile=ci-out/errors.log;errorsonly"
      - name: Unit and bUnit tests
        run: dotnet test Realm.slnx -c Release --no-build --logger trx --results-directory ci-out/trx
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: dotnet, path: ci-out, retention-days: 3 }

  publish-ci:                                     # 7.4
    needs: [guards, dotnet]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    concurrency: { group: ci-artifacts-publish, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/download-artifact@v8
        with: { path: ci-in }                     # every artifact, one sub-folder each
      - run: node tools/ci/make-summary.mjs --in ci-in --out ci-out --needs '${{ toJSON(needs) }}'
      - run: cat ci-out/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - run: bash tools/ci/publish-ci-artifacts.sh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }   # the script pushes through an explicit x-access-token URL built from GH_TOKEN (04 S0a, R3-033), never through whatever actions/checkout persisted
