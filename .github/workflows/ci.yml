name: ci
on:
  push: { branches-ignore: [ci-artifacts], tags-ignore: ["**"] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
defaults: { run: { shell: bash } }               # explicit shell = bash -eo pipefail, so "cmd | tee log" still fails the step
env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
jobs:
  guards:                                         # 7.3: seconds; fails fast on policy violations, and the expensive jobs wait for it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Guards (the full output is kept in guards.log, also when a guard fails; make-summary.mjs prints it in SUMMARY.md)
        run: |
          set -o pipefail
          mkdir -p ci-out
          node tools/ci/guards.mjs 2>&1 | tee ci-out/guards.log
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: guards, path: ci-out, retention-days: 3 }

  dotnet:
    needs: guards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: global.json }
      - uses: actions/cache@v6
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: mkdir -p ci-out/trx
      - run: dotnet restore Realm.slnx 2>&1 | tee ci-out/restore.log
      - name: Build (warnings are errors; errors.log is what the author reads)
        run: >
          dotnet build Realm.slnx -c Release --no-restore
          -flp:"logfile=ci-out/build.log;verbosity=minimal" -flp1:"logfile=ci-out/errors.log;errorsonly"
      - name: Publish the web app for the e2e job (S6a; right after the build, so e2e still runs when a unit test fails)
        run: dotnet publish src/Realm.Web/Realm.Web.csproj -c Release --no-build -o publish/web -p:UseAppHost=false
      - name: Unit and bUnit tests
        run: dotnet test Realm.slnx -c Release --no-build --logger trx --results-directory ci-out/trx
      - if: always()                              # S5b: two paths put the artifact root at the workspace, so the e2e job reads tests/contract/payloads next to ci-out
        uses: actions/upload-artifact@v7
        with:
          name: dotnet
          path: |
            ci-out
            tests/contract/payloads
          retention-days: 3
      - if: always()                              # S6a: nothing is uploaded (a warning, no failure) when the build died before the publish step
        uses: actions/upload-artifact@v7
        with: { name: publish-web, path: publish/web, retention-days: 1 }

  js:                                             # 7.2, S5a: types and Node tests of wwwroot/js and tools/ci; no browser, no C#
    needs: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: mkdir -p ci-out
      - run: npm run typecheck 2>&1 | tee ci-out/tsc.log
      - run: node --test --test-reporter=tap "tests/js/**/*.test.mjs" 2>&1 | tee ci-out/js-tests.tap
      - name: Validate map styles (third-party fetch is soft)
        continue-on-error: true
        run: node tools/ci/validate-styles.mjs 2>&1 | tee ci-out/styles.log
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: js, path: ci-out, retention-days: 3 }

  docker-smoke:                                   # 7.8, S2: the Dockerfile is built and exercised on every push, not only at release
    needs: guards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image on the runner (loaded into the local daemon, nothing is pushed anywhere)
        uses: docker/build-push-action@v7
        with: { context: ., load: true, push: false, tags: "realm:smoke", cache-from: "type=gha,scope=smoke", cache-to: "type=gha,scope=smoke,mode=max" }
      - name: Image smoke (items 1 to 4, 9 and 10 of 03 section 7.8; Demo data, no Home Assistant; writes smoke.json)
        run: |
          set -o pipefail
          mkdir -p ci-out
          bash tools/ci/image-smoke.sh realm:smoke 2>&1 | tee ci-out/smoke.log
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: docker-smoke, path: ci-out, retention-days: 3 }

  e2e:                                            # 7.5, S6a: Playwright behind the ingress proxy, against the published app in Demo mode
    needs: [guards, dotnet]
    if: ${{ !cancelled() && needs.guards.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: dl
        uses: actions/download-artifact@v8
        continue-on-error: true
        with: { name: publish-web, path: publish/web }
      - if: steps.dl.outcome != 'success'
        run: echo "::error::no published build; the dotnet job failed before publish, read its errors.log" && exit 1
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with: { path: ~/.cache/ms-playwright, key: "pw-${{ runner.os }}-${{ steps.pw.outputs.v }}" }
      - run: npx playwright install --with-deps chromium
      - name: Demo cast for the tests (single source of truth, 02 section 9.2; no host is built)
        run: |
          mkdir -p tests/e2e/fixtures
          dotnet publish/web/Realm.Web.dll export-demo-cast tests/e2e/fixtures/demo-cast.json
      - id: contract_dl
        uses: actions/download-artifact@v8
        continue-on-error: true
        with: { name: dotnet, path: ci-in-dotnet }
      # The C# golden payloads are validated by node (03 section 4.5, G-9). The step does not stop the job: Playwright still runs, so one push shows both
      # results, and the last step of the job fails it if this one did. The TAP file is what make-summary.mjs reads. An empty folder would make the
      # golden test skip, so a missing one fails when the dotnet job passed (03 only warned: a vacuous pass hides a broken fixture upload).
      - id: contract
        name: Payload contract (C# fixtures validated by node)
        continue-on-error: true
        run: |
          mkdir -p ci-out/e2e
          if ls ci-in-dotnet/tests/contract/payloads/*.json > /dev/null 2>&1; then
            mkdir -p tests/contract
            cp -r ci-in-dotnet/tests/contract/payloads tests/contract/
            node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=ci-out/e2e/contract.tap "tests/contract/**/*.test.mjs"   # quoted glob (PR-3, R3-009)
          elif [ "${{ needs.dotnet.result }}" = "success" ]; then
            echo "::error::the dotnet job passed but uploaded no tests/contract/payloads (PayloadContractTests writes them)"
            exit 1
          else
            echo "::warning::payload fixtures missing (the dotnet tests died early)"
          fi
      - name: Run E2E (Demo mode behind the ingress harness)
        run: npx playwright test --config tests/e2e/playwright.config.ts
        env: { CI: "true", REALM_APP_DLL: publish/web/Realm.Web.dll }
      - if: always()                              # ci-out holds only e2e/ (results.json, html, artifacts, app.log, contract.tap) and shots/ (the gallery, S6b)
        uses: actions/upload-artifact@v7
        with: { name: e2e, path: ci-out, retention-days: 3 }
      - if: steps.contract.outcome == 'failure'
        run: echo "::error::the payload contract step failed (details in the step above and in SUMMARY.md)" && exit 1

  publish-ci:                                     # 7.4
    needs: [guards, dotnet, js, docker-smoke, e2e]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    # No job-level concurrency here on purpose: GitHub keeps one running and ONE pending job per group and cancels the
    # rest, so a third publisher would lose its SUMMARY. The script serializes itself (orphan commit, --force-with-lease, retries).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/download-artifact@v8
        with: { path: ci-in }                     # every artifact, one sub-folder each
      - run: node tools/ci/make-summary.mjs --in ci-in --out ci-out --needs '${{ toJSON(needs) }}'
      - run: cat ci-out/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - run: bash tools/ci/publish-ci-artifacts.sh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }   # the script pushes through an explicit x-access-token URL built from GH_TOKEN (04 S0a, R3-033), never through whatever actions/checkout persisted
